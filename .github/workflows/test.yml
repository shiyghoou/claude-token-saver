# テストは「走らせた人が申告する」ものにしない。ゲート群（アサーション層の
# 生存確認・件数の台帳・検証を含まないテストの検出）は、実行されなければ
# 何も守らないため、push と PR で必ず回す。
name: test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 依存を確認する
        run: |
          bash --version | head -1
          python3 --version
          git --version

      # install.sh / uninstall.sh のテストは使い捨てリポジトリを作って commit する。
      # runner には既定の identity が無いため、ここで与える。
      - name: git の identity を設定する
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "ci"
          git config --global init.defaultBranch main

      - name: シェルスクリプトの構文を検査する
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(git ls-files -z -- '*.sh')

      - name: ShellCheckを導入する
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          shellcheck --version

      - name: ShellCheckを実行する
        run: |
          git ls-files -z -- 'install.sh' 'uninstall.sh' 'scripts/' |
            xargs -0 shellcheck --shell=bash --severity=error

      - name: テストを実行する
        env:
          CTS_NO_SKIP: "1"
        run: bash test/run.sh

  # macOS の /bin/bash は 3.2 である。bash 4.4 未満では set -u 下の素の配列展開が
  # 空配列で unbound variable になり、それはシェル自身を落とす致命的エラーなので
  # ERR トラップでは捕まらない。実測では終了コード 1・stdout 0 バイトで、
  # しかも消費だけが先に済むため引き継ぎが永久に失われた。
  #
  # test/run.sh 自体が mapfile を使うため、スイートを 3.2 では回せない。
  # スイート側は静的検査（ガード無しの配列展開の検出）で守り、ここでは実際の
  # bash 3.2 でフックと token-report launcher を end-to-end に走らせ、静的検査が現実と対応している
  # ことを確かめる。docker が無ければ落とす（黙って飛ばすと、この防御が
  # 「あるつもり」のまま消える）。
  bash32:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: docker があることを確かめる
        run: docker --version

      - name: bash 3.2 でフックとtoken-reportをend-to-end実行する
        run: bash test/bash32-e2e.sh
